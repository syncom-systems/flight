# SPDX-License-Identifier: MIT
#
# Flight release candidates and releases (docs/releases/v1.0-contract.md, section 9).
#
# Pushing a tag `vX.Y.Z` or `vX.Y.Z-rc.N` starts this workflow. Tag creation is restricted
# by a repository ruleset to the owner; tags cannot be moved or deleted once made. The
# workflow never publishes: its end product is a DRAFT GitHub Release, and publishing a
# draft is a manual act by the owner after reading the evidence.
#
#   verify    the tag names the workspace version, the commit is on main, the lock file holds
#   gates     the development CI (fmt, clippy, tests on Linux and macOS) on the tagged commit
#   build     release binaries for each supported target, packaged and smoke-tested
#   draft     checksums, provenance attestations, release notes, draft release
#
# Third-party actions are pinned to a commit. No long-lived secret is used: attestations are
# signed with the workflow's short-lived OIDC identity (Sigstore).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]
  # A dry run on any branch: same gates, packages, attestations and draft, but no tag checks,
  # and the draft is deleted at the end.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: v
        run: |
          set -eu
          want=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          version="$want"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [ "$version" != "$want" ]; then
              echo "tag $tag does not match the workspace version $want" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "$GITHUB_SHA is not on main" >&2
              exit 1
            fi
          fi
          case "$version" in *-*) pre=true ;; *) pre=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
      - name: Lock file is current
        run: cargo metadata --locked --format-version 1 > /dev/null

  gates:
    name: gates
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.target }})
    needs: [verify, gates]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            # Debian 12 (glibc 2.36): the binary runs on it and on anything newer.
            container: rust:1-bookworm
          - target: aarch64-apple-darwin
            runs-on: macos-latest
            container: ""
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      FLIGHT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: cargo build --release --locked -p flight
      - name: Package
        run: |
          set -eu
          name="flight-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/flight LICENSE NOTICE.md THIRD_PARTY.md README.md "dist/$name/"
          cp -R contrib docs/install.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Smoke test the packaged binary
        run: |
          set -eu
          name="flight-${VERSION}-${{ matrix.target }}"
          mkdir smoke && tar -C smoke -xzf "dist/$name.tar.gz"
          got=$("smoke/$name/flight" --version)
          want="flight ${VERSION} (${GITHUB_SHA})"
          # The embedded commit is the full sha from FLIGHT_COMMIT.
          if [ "$got" != "$want" ]; then
            echo "version output '$got' != '$want'" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  draft:
    name: draft release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write # Sigstore signing identity for the attestations
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum flight-*.tar.gz | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/flight-*.tar.gz
      - name: Draft release
        run: |
          set -eu
          # A dry run (no tag) makes the same draft under a throwaway name, targeting the
          # commit, proves it, and deletes it: a draft creates no tag.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="v${VERSION}"
            flags="--verify-tag"
            dry=false
          else
            tag="dryrun-${GITHUB_RUN_ID}"
            flags="--target ${GITHUB_SHA}"
            dry=true
          fi
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "release $tag already exists; artifacts are never replaced" >&2
            exit 1
          fi
          flags="$flags --draft --title $tag --generate-notes"
          if [ "${{ needs.verify.outputs.prerelease }}" = true ] || [ "$dry" = true ]; then
            flags="$flags --prerelease"
          fi
          {
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo "Verify a download:"
            echo
            echo '```'
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo "gh attestation verify flight-${VERSION}-<target>.tar.gz --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "Supported platforms and guarantees: docs/releases/v1.0-contract.md at this tag."
          } > notes.md
          gh release create "$tag" $flags --notes-file notes.md dist/flight-*.tar.gz dist/SHA256SUMS
          gh release view "$tag" --json isDraft,isPrerelease,tagName,targetCommitish,assets \
            --jq '{tagName,isDraft,isPrerelease,targetCommitish,assets:[.assets[].name]}'
          if [ "$dry" = true ]; then
            gh release delete "$tag" --yes
          fi
