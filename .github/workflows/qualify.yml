# SPDX-License-Identifier: MIT
#
# Release qualification that is too slow or too broad for every pull request. Run by hand
# (Actions -> Qualify -> Run workflow); results are recorded in docs/releases/v1.0-readiness.md
# with the run URL.
#
#   tmux-versions   the full test suite against several distributions' tmux, to find the oldest
#                   tmux Flight is verified on (the minimum in the release contract)
#   clean-install   the packages of a Release run, verified (attestation) and walked through by
#                   tools/smoke/journey.sh (single machine) and distributed.sh (orchestrator,
#                   node and dashboard as separate enrolled processes) on a machine with no
#                   Rust toolchain and no Flight state: Debian 12 in a container on Linux x86_64, and a fresh macOS runner
name: Qualify

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: "Run id of a Release workflow run whose packages to install and walk through (empty: skip the clean-install jobs)"
        required: false
        default: ""
      only:
        description: "Run only this job group while debugging (service, multinode, launchd, homebrew, setup); empty runs everything"
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tmux-versions:
    name: tests on ${{ matrix.name }}
    if: inputs.only == ''
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container || null }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Debian 11 (tmux 3.1c)", runs-on: ubuntu-latest, container: "rust:1-bullseye", supported: false }
          - { name: "Ubuntu 22.04 (tmux 3.2a)", runs-on: ubuntu-22.04, container: "", supported: false }
          - { name: "Debian 12 (tmux 3.3a)", runs-on: ubuntu-latest, container: "rust:1-bookworm", supported: true }
          - { name: "Ubuntu 24.04 (tmux 3.4)", runs-on: ubuntu-24.04, container: "", supported: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and test prerequisites
        run: |
          set -eu
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
          $SUDO apt-get update
          $SUDO apt-get install -y tmux python3 gcc
          tmux -V
      - name: "Supported tmux: the whole test suite"
        if: matrix.supported
        run: cargo test --workspace
      - name: "Unsupported tmux: Flight refuses clearly and starts nothing"
        if: ${{ !matrix.supported }}
        run: |
          set -u
          cargo build -p flight
          if out=$(target/debug/flight solo --config-dir "$RUNNER_TEMP/refused" 2>&1); then
            echo "Flight started on an unsupported tmux"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "older than the 3.3 Flight needs" || { echo "the refusal does not say why"; exit 1; }
          [ ! -e "$RUNNER_TEMP/refused" ] || { echo "a refused start left files behind"; exit 1; }

  clean-install-linux:
    name: clean install (Debian 12, x86_64)
    if: inputs.release_run != '' && inputs.only == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - name: Verify provenance and unpack
        run: |
          set -eu
          cd pkg
          sha256sum flight-*.tar.gz
          gh attestation verify flight-*.tar.gz --repo "$GITHUB_REPOSITORY"
          tar -xzf flight-*.tar.gz
          ls
      - name: Walk through on a bare Debian 12
        run: |
          set -eu
          bin=$(echo pkg/flight-*/flight)
          docker run --rm -v "$PWD:/w" -w /w debian:12-slim bash -c \
            "apt-get update -qq && apt-get install -y -qq tmux procps && tmux -V && ldd /w/$bin | head -5 && /w/$bin --version && /w/tools/smoke/journey.sh /w/$bin && /w/tools/smoke/distributed.sh /w/$bin"

  clean-install-macos:
    name: clean install (macOS, Apple silicon)
    if: inputs.release_run != '' && inputs.only == ''
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - name: Verify provenance and unpack
        run: |
          set -eu
          cd pkg
          shasum -a 256 flight-*.tar.gz
          gh attestation verify flight-*.tar.gz --repo "$GITHUB_REPOSITORY"
          tar -xzf flight-*.tar.gz
      - name: Install tmux
        run: brew install tmux && tmux -V
      - name: Walk through
        run: |
          set -eu
          bin=$(echo "$PWD"/pkg/flight-*/flight)
          "$bin" --version
          tools/smoke/journey.sh "$bin"
          tools/smoke/distributed.sh "$bin"

  upgrade-linux:
    name: upgrade and rollback (Linux x86_64)
    if: inputs.release_run != '' && inputs.only == ''
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install tmux
        run: apt-get update -qq && apt-get install -y -qq tmux procps && tmux -V
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The last main before schema 2 (it writes version 1 files and has no --version).
          ref: 5fbe06d893e915d40adf36ac144b0d562d937093
          path: old
      - run: cargo build --release --locked -p flight
        working-directory: old
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - run: |
          set -eu
          tar -C pkg -xzf pkg/flight-*.tar.gz
          new=$(echo "$PWD"/pkg/flight-*/flight)
          "$new" --version
          new/tools/smoke/upgrade.sh "$PWD/old/target/release/flight" "$new"

  service-linux:
    name: systemd user services (Linux x86_64)
    if: inputs.release_run != '' && (inputs.only == '' || inputs.only == 'service')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - run: |
          set -eu
          tar -C pkg -xzf pkg/flight-*.tar.gz
          tools/smoke/service_linux.sh "$(echo "$PWD"/pkg/flight-*/)"

  multinode-linux:
    name: several machines with faults (containers, Linux x86_64)
    if: inputs.release_run != '' && (inputs.only == '' || inputs.only == 'multinode')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - name: The previous release, for a mixed fleet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          prev=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName -q '.[0].tagName')
          echo "previous release: $prev"
          mkdir prev
          gh release download "$prev" --pattern '*x86_64-unknown-linux-gnu.tar.gz' --dir prev
          tar -C prev -xzf prev/flight-*.tar.gz
      - run: |
          set -eu
          tar -C pkg -xzf pkg/flight-*.tar.gz
          tools/smoke/multinode.sh "$(echo "$PWD"/pkg/flight-*/flight)" "$(echo "$PWD"/prev/flight-*/flight)"

  launchd-macos:
    name: launchd service (macOS, Apple silicon)
    if: inputs.release_run != '' && (inputs.only == '' || inputs.only == 'launchd')
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-aarch64-apple-darwin
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - run: brew install tmux
      - run: |
          set -eu
          tar -C pkg -xzf pkg/flight-*.tar.gz
          tools/smoke/service_macos.sh "$(echo "$PWD"/pkg/flight-*/flight)"

  homebrew-formula:
    name: Homebrew formula on the package (${{ matrix.name }})
    if: inputs.release_run != '' && (inputs.only == '' || inputs.only == 'homebrew')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "macOS arm64", os: macos-14, artifact: dist-aarch64-apple-darwin }
          - { name: "Linux x86_64", os: ubuntu-24.04, artifact: dist-x86_64-unknown-linux-gnu }
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - name: Homebrew on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - run: tools/release/check-homebrew.sh "$(echo "$PWD"/pkg/flight-*.tar.gz)"

  setup-linux:
    name: guided setup on a bare Debian 12 (x86_64)
    if: inputs.release_run != '' && (inputs.only == '' || inputs.only == 'setup')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-unknown-linux-gnu
          run-id: ${{ inputs.release_run }}
          github-token: ${{ github.token }}
          path: pkg
      - run: |
          set -eu
          tar -C pkg -xzf pkg/flight-*.tar.gz
          bin=$(echo pkg/flight-*/flight)
          docker run --rm -v "$PWD:/w" -w /w debian:12-slim bash -c "/w/tools/smoke/setup_linux.sh /w/$bin"

  dependency-audit:
    name: dependency advisories (cargo audit)
    if: inputs.only == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked --version 0.22.2
      # serial 0.4 (RUSTSEC-2017-0008, unmaintained, no vulnerability) arrives through
      # portable-pty, which the node uses for terminals; accepted and listed in the readiness
      # matrix. Any other advisory, vulnerability or warning fails this job.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2017-0008
